<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room ratings</title>
<link rel="stylesheet" href="lib/jspsych.css">
<script src="lib/jspsych.js"></script>
<script src="lib/plugin-preload.js"></script>
<script src="lib/plugin-html-button-response.js"></script>
<script src="room-rating-plugin.js"></script>
<style>
  body { background: #f4f4f2; font-family: system-ui, Segoe UI, Arial, sans-serif; }
  .jspsych-content { max-width: 1300px; }
  .txt { max-width: 760px; margin: 0 auto; text-align: left; font-size: 18px; line-height: 1.5; }
  .rr { display: flex; gap: 28px; align-items: flex-start; justify-content: center; text-align: left; }
  .rr img { width: 880px; height: 660px; display: block; border-radius: 3px; background: #ddd; }
  .rr .panel { width: 330px; }
  .rr .q { margin-bottom: 30px; }
  .rr .q p { font-size: 17px; margin: 0 0 10px; line-height: 1.35; }
  .rr .scale { display: flex; gap: 6px; }
  .rr .scale button { flex: 1; font-size: 18px; padding: 10px 0; border: 1px solid #888; background: #fff; border-radius: 4px; cursor: pointer; }
  .rr .scale button:hover { background: #e6eef8; }
  .rr .scale button.sel { background: #2b5fa8; color: #fff; border-color: #2b5fa8; }
  .rr .ends { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-top: 4px; }
  .rr .next { font-size: 18px; padding: 10px 28px; border: 0; border-radius: 4px; background: #2b5fa8; color: #fff; cursor: pointer; }
  .rr .next:disabled { background: #b8b8b8; cursor: default; }
  .practice-tag { font-size: 13px; color: #a05a00; margin-bottom: 8px; }
</style>
</head>
<body></body>
<script>
// Experiment: PRESPEC_experiment_rooms.md Sections 4.3-4.4. 80 registered images, each once, curvature + liking on one screen
// (question order counterbalanced across participants), 2 practice images, 4 attention checks. Results saved by serve.py.
(async function () {
  // With serve.py: number and question order from /assign. Without it (static site, e.g. GitHub Pages): ?pid=7 in the URL
  // (odd = curvature first, as in serve.py), else a random number; results are then downloaded as a file at the end.
  const urlN = parseInt(new URLSearchParams(location.search).get('pid'), 10);
  const n0 = Number.isFinite(urlN) && urlN > 0 ? urlN : Math.floor(Math.random() * 1e3);
  let assign = { n: n0, curv_first: n0 % 2 === 1 };
  let server = false;
  try {
    const r = await fetch('assign');
    if (r.ok && (r.headers.get('Content-Type') || '').includes('json')) { assign = await r.json(); server = true; }
  } catch (e) { console.warn('no server: ' + e); }
  const pid = 'p' + String(assign.n).padStart(3, '0');
  const curvFirst = assign.curv_first;

  const jsPsych = initJsPsych({ on_finish: async () => {
    const ok = await saveData(true);
    const msg = ok ? 'Your responses were saved.' : `A file with your responses (${pid}_responses.json) was downloaded. Please send it to the experimenter.`;
    document.body.innerHTML = `<div style="text-align:center;margin-top:120px;font:20px system-ui"><h2>Done</h2><p>${msg} You can close this window.</p></div>`;
  } });
  jsPsych.data.addProperties({
    participant: pid, curv_first: curvFirst, user_agent: navigator.userAgent,
    screen_w: screen.width, screen_h: screen.height, start_time: new Date().toISOString()
  });

  async function saveData(complete) {
    const rows = jsPsych.data.get().values();
    if (server) {
      try {
        const r = await fetch('save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ participant: pid, complete: !!complete, rows }) });
        if (r.ok) return true;
      } catch (e) { console.warn('save failed: ' + e); }
    }
    if (complete) jsPsych.data.get().localSave('json', pid + '_responses.json');
    return false;
  }

  const stimuli = await (await fetch('stimuli.json')).json();
  const practice = [
    { image_id: 'practice_AA2', file: 'stimuli/practice_AA2.jpg' },
    { image_id: 'practice_CC2', file: 'stimuli/practice_CC2.jpg' }
  ];
  const allFiles = stimuli.map(s => s.file).concat(practice.map(p => p.file));

  const ratingTrial = (item, isPractice) => ({
    type: jsPsychRoomRating,
    image: item.file,
    curv_first: curvFirst,
    q_curv: 'How curved or angular does this room look?',
    q_like: 'How much do you like this room?',
    labels_curv: ['very angular', 'very curvy'],
    labels_like: ['not at all', 'very much'],
    practice: isPractice,
    data: Object.assign({ task: isPractice ? 'practice' : 'rating' }, item)
  });

  const timeline = [];
  const MIN_W = 1270, MIN_H = 700;
  const sizeOk = () => window.innerWidth >= MIN_W && window.innerHeight >= MIN_H;
  timeline.push({
    timeline: [{
      type: jsPsychHtmlButtonResponse,
      stimulus: () => `<div class="txt"><h2>Room ratings</h2>
        <p>In this short experiment you will look at pictures of rooms and rate them. It takes about 20 minutes.
        You can stop at any time by closing the window. Your responses stay on this computer; nothing is sent over the internet.</p>
        <p>The pictures are large. Please use a computer (not a phone) and make this browser window as large as you
        can (press F11 for full screen).</p>
        <p style="color:#a00">${sizeOk() ? '' :
          `Your window is ${window.innerWidth} x ${window.innerHeight}; it needs to be at least ${MIN_W} x ${MIN_H}. Please enlarge it, then press Continue.`}</p></div>`,
      choices: ['Continue'],
      data: { task: 'window_check' },
      on_finish: d => { d.window_w = window.innerWidth; d.window_h = window.innerHeight; }
    }],
    loop_function: () => !sizeOk()
  });

  timeline.push({ type: jsPsychPreload, images: allFiles, show_progress_bar: true, message: '<p>Loading the pictures ...</p>', data: { task: 'preload' } });

  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: `<div class="txt"><h2>Instructions</h2>
      <p>You will see 80 pictures of rooms, one at a time. For each picture you answer two questions on a scale from 1 to 5:</p>
      <ul><li><b>How curved or angular does this room look?</b> 1 = very angular, 5 = very curvy.</li>
      <li><b>How much do you like this room?</b> 1 = not at all, 5 = very much.</li></ul>
      <p>Go with your first impression; there are no right or wrong answers. Both questions are on the same screen.
      Press <b>Next</b> after answering both.</p>
      <p>Now and then a screen will ask you to click a given number. Please follow it.</p>
      <p>First, two practice pictures.</p></div>`,
    choices: ['Start practice'], data: { task: 'instructions' }
  });
  practice.forEach(p => timeline.push(ratingTrial(p, true)));
  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: '<div class="txt"><p>That was the practice. The real pictures start now.</p></div>',
    choices: ['Start'], data: { task: 'instructions' }
  });

  // 80 test trials in a random order; 4 attention checks (before trial 14, 34, 54, 70, each +-3)
  const order = jsPsych.randomization.shuffle(stimuli.slice());
  const checkAt = [14, 34, 54, 70].map(p => p + Math.floor(Math.random() * 7) - 3);
  let nRated = 0;
  order.forEach((item, i) => {
    if (checkAt.includes(i)) {
      const target = 1 + Math.floor(Math.random() * 5);
      timeline.push({
        type: jsPsychHtmlButtonResponse,
        stimulus: `<div class="txt" style="text-align:center"><p>To show that you are paying attention, please click the number <b>${target}</b>.</p></div>`,
        choices: ['1', '2', '3', '4', '5'],
        data: { task: 'attention', target },
        on_finish: d => { d.correct = (d.response + 1) === d.target; }
      });
    }
    const t = ratingTrial(item, false);
    t.data.trial_index_in_block = i;
    t.on_finish = () => { if (++nRated % 10 === 0) saveData(false); };
    timeline.push(t);
  });

  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: '<div class="txt" style="text-align:center"><h2>Thank you</h2><p>You have finished. Press Finish to save your responses.</p></div>',
    choices: ['Finish'], data: { task: 'end' }
  });
  timeline.push({
    type: jsPsychHtmlButtonResponse,
    stimulus: '<div class="txt" style="text-align:center"><p>Saving ...</p></div>',
    choices: [], trial_duration: 1500, data: { task: 'done' }
  });

  jsPsych.run(timeline);
})();
</script>
</html>
